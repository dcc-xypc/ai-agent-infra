options:
  logging: CLOUD_LOGGING_ONLY

steps:
# 1. Terraform 初期化 (Init)
# 目的：连接到 GCS 状态后端，获取环境状态
- name: 'hashicorp/terraform:latest'
  id: 'Terraform Init'
  args:
    - '-chdir=environments'
    - 'init'
    - '-backend-config=bucket=${_TF_STATE_BUCKET}'
    - '-backend-config=prefix=terraform/state'
    - '-upgrade'
  volumes:
    - name: 'tf-data'
      path: '/root/.terraform'

# 2. Terraform 計画 (Destroy Plan)
- name: 'hashicorp/terraform:latest'
  id: 'Terraform Destroy Plan'
  args:
    - '-chdir=environments'
    - 'plan'
    - '-destroy'
    - '-var-file=${_ENV_NAME}/${_ENV_NAME}.tfvars'
    - '-out=/workspace/tfdestroyplan'
    - '-input=false'
  volumes:
    - name: 'tf-data'
      path: '/root/.terraform'

# 3. Terraform 適用 (Destroy Apply)
# 目的：执行销毁操作
- name: 'hashicorp/terraform:latest'
  id: 'Terraform Destroy Apply'
  args:
    - '-chdir=environments'
    - 'apply'
    - '-auto-approve'
    - '/workspace/tfdestroyplan'
  volumes:
    - name: 'tf-data'
      path: '/root/.terraform'

